# Russian game terms as the Russian Rules Reference (Hobby World, 2021) names them,
# with the project's own choices from CLAUDE.md: commodities are "Продукция", trade goods "товары".
# Go's \b is ASCII-only, so the patterns match Cyrillic word stems with nonword on.
extends: substitution
message: "Термин игры: «%s» вместо «%s»."
level: warning
ignorecase: true
nonword: true
swap:
  'командн\p{L}* жетон\p{L}*|жетон\p{L}* команд\p{L}*': жетон приказа
  'жетон\p{L}* тактики|тактическ\p{L}* жетон\p{L}*': жетон приказа из тактического резерва
  'жетон\p{L}* стратегии|стратегическ\p{L}* жетон\p{L}*': жетон приказа из стратегического резерва
  'тактическ\p{L}* пул\p{L}*|пул\p{L}* тактик\p{L}*': тактический резерв
  'пул\p{L}* флота': резерв флота
  'космодок\p{L}*|космическ\p{L}* док\p{L}*|верф\p{L}*': база
  'наземн\p{L}* (?:юнит\p{L}*|единиц\p{L}*|отряд\p{L}*|сил\p{L}*)': наземные войска
  'вторичн\p{L}*': второстепенная способность
  'торгов\p{L}* товар\p{L}*': товары
  'коммодит\p{L}*|сырь\p{L}*': Продукция
  'подкреплени\p{L}*': снабжение
  'вместимост\p{L}*': места на борту
  'скорост\p{L}* (?:корабл\p{L}*|полёта)': значение полёта
  'спикер\p{L}*': председатель
  'устойчивост\p{L}*': поглощение урона
