<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Юниты на гексе</title>
<style>
  :root{--bg:#0d1016;--panel:#151a23;--panel2:#1b212c;--line:#2b3442;--line2:#3b4658;--tx:#eef1f6;--tx2:#a7b0c0;--tx3:#737e91;--blue:#7fb2ff;--gold:#e8c56a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  body{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100vh;overflow:hidden}
  main{overflow-y:auto;padding:18px 22px}
  aside{background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow-y:auto}
  h1{font-size:20px;font-weight:650;margin:0 0 3px}.sub{color:var(--tx3);font-size:13px;margin:0 0 12px}
  h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin:16px 0 8px}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
  .chip{padding:7px 12px;border-radius:18px;border:1px solid var(--line2);background:transparent;color:var(--tx2);cursor:pointer;font:13px system-ui;min-height:36px;transition:background .18s,border-color .18s,color .18s}
  .chip.on{background:#233454;border-color:var(--blue);color:#fff}
  .sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .15s,border-color .15s}
  .sw.on{border-color:#eef1f6;transform:scale(1.12)}
  .hexes{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
  .hexcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
  .hexcard p{margin:6px 0 0;font-size:12px;color:var(--tx3);text-align:center}
  svg{display:block}
  .lg{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;align-items:center}
  .lg span{font-size:13.5px}
  .gc{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;color:var(--tx2);font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;transition:border-color .16s,background .16s}.gc.on{border-color:var(--blue);background:#1c2a42;box-shadow:0 0 0 1px var(--blue);color:var(--tx)}.gc b{font-size:14px}.gc small{font-size:12px;color:var(--tx3)}@media (hover:hover){.gc:hover{border-color:#55617a}}
  .stps{display:flex;flex-direction:column;gap:8px;justify-content:center}.stp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2)}.stp span{width:92px}.stp b{min-width:20px;text-align:center;color:var(--tx)}.icb{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);cursor:pointer;font-size:16px}
  .stage{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}.bighex{touch-action:manipulation}.side{min-width:230px;flex:1}
  .seg{display:flex;gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden}.seg button{flex:1;min-height:44px;border:0;background:transparent;color:var(--tx2);font:600 14px system-ui;cursor:pointer;transition:background .16s,color .16s}.seg button+button{border-left:1px solid var(--line2)}.seg button.on{background:#233454;color:#fff}
  .tk{transition:transform .44s cubic-bezier(.3,1.22,.5,1);cursor:pointer}.pl{cursor:pointer}
  @media (prefers-reduced-motion:reduce){.tk{transition:none}}
  .pv{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;color:var(--tx3);font:12px system-ui;text-align:center;transition:border-color .16s}.pv.on{border-color:var(--blue)}.pv span{display:block;margin-top:4px}
  .shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.sc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:92px;padding:6px 2px 5px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--tx2);font:11.5px/1.2 system-ui;cursor:pointer;transition:border-color .14s,transform .12s}.sc:active{transform:scale(.94)}.sc:disabled{opacity:.38;cursor:default}.sc b{color:var(--gold);font-size:13px}.sc i{position:absolute;top:4px;right:6px;font-style:normal;font-weight:700;color:var(--tx)}
  @media (hover:hover){.sc:not(:disabled):hover{border-color:#55617a}}
  .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);color:var(--tx2)}.tot b{font-size:20px;color:var(--gold)}
  .lostc{display:flex;flex-wrap:wrap;gap:6px;min-height:60px}.lostc button{position:relative;width:60px;height:60px;padding:0;border:1px dashed var(--line2);border-radius:10px;background:transparent;cursor:pointer;opacity:.75}.lostc i{position:absolute;right:4px;bottom:2px;font-style:normal;font-weight:700;color:var(--tx);font-size:12px}
  .empty{color:var(--tx3);font-size:12.5px;margin:0}
  .ul{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px;margin-bottom:4px}.ua{display:flex;align-items:center;gap:8px;min-height:44px;padding:2px 8px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--tx);font:13.5px system-ui;cursor:pointer;text-align:left;transition:border-color .14s,background .14s}.ua:disabled,.um:disabled{opacity:.38;cursor:default}.ua b{margin-left:auto;color:var(--blue)}.um{border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--tx2);font-size:18px;cursor:pointer}
  @media (hover:hover){.ua:not(:disabled):hover{border-color:#55617a}}
  .lb{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);margin:12px 0 6px;font-weight:600}
  .row2{display:flex;gap:6px;margin-top:10px}.row2 button{flex:1;min-height:40px;border:1px solid var(--line2);border-radius:9px;background:transparent;color:var(--tx2);font:13px system-ui;cursor:pointer}
  .big{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
  .bigc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--tx2)}
  .note{font-size:12.5px;color:var(--tx2);line-height:1.4;margin:0}
</style></head><body>

      if(cand.length<n)return;cand.sort(function(a,b){return Math.round(a.dist*2)-Math.round(b.dist*2)||b.y-a.y||Math.abs(a.x)-Math.abs(b.x)||a.x-b.x});var pick=cand.slice(0,n),asym=0,sum=0;pick.forEach(function(p){sum+=p.dist;if(!pick.some(function(r){return Math.abs(r.x+p.x)<.5&&Math.abs(r.y-p.y)<.5}))asym++});
      var ext=SIDES.map(function(v){return pick.reduce(function(t,p){return Math.max(t,p.x*v[0]+p.y*v[1])},-99)}),spread=Math.max.apply(null,ext)-Math.min.apply(null,ext);
      var score=sum/n+asym*3+spread*.8;if(!best||score<best.score)best={score:score,pick:pick}})});
    return best?best.pick:null}
  function layout(list,np){var ships=[],ground=[];list.forEach(function(u){if(SHIPS.indexOf(u.kind)>=0)ships.push(u);else if(np>0)ground.push({key:u.key,owner:u.owner,kind:u.kind,n:u.n,pl:u.pl%np})});
    for(var sz=22;sz>=6;sz-=.5){var pls=planetsAt(np,sz),gs=Math.min(sz*.92,17),obst=[NUM].concat(pls),g=placeGround(ground,pls,gs,obst);if(!g)continue;var sl=comb(ships.length,sz,obst);if(!sl)continue;
      var cmp=function(a,b){return a.y-b.y||a.x-b.x},mine=ships.filter(function(u){return u.owner==='m'}).sort(function(a,b){return rank(a)-rank(b)}),en=ships.filter(function(u){return u.owner==='e'}).sort(function(a,b){return rank(a)-rank(b)});
      sl=sl.slice().sort(function(a,b){return a.x-b.x||a.y-b.y});var A=sl.slice(0,mine.length).sort(cmp),B=sl.slice(mine.length).sort(cmp),items=g;

    return {s:6,items:[],pls:planetsAt(np,6)}}
  window.__layout=layout;window.__planets=PLANETS;
  function list(){var o=[];Object.keys(units).forEach(function(k){var n=units[k];if(n<1)return;var q=k.split('|');o.push({key:k,owner:q[0],kind:q[1],pl:q[2]==='-'?0:+q[2],n:n})});return o}
  function colorOf(o){return o==='m'?COL[col]:COL[(col+2)%8]}
  function shell(w,inner){return '<svg viewBox="-55 -48 110 96" width="'+w+'" height="'+(w*.873)+'" style="overflow:visible"><polygon points="53,0 26.5,46 -26.5,46 -53,0 -26.5,-46 26.5,-46" fill="#1b212c" stroke="#3b4658"/><text x="'+NUM.x+'" y="'+(NUM.y+1.8)+'" text-anchor="middle" font-size="5" font-weight="700" fill="#a7b0c0">26</text>'+inner+'</svg>'}
  // Планета рисуется в базовом размере r=10 и масштабируется вместе со всем остальным.
  function planetBody(i,on){var v=PV[i];return '<circle r="10" fill="#26303f" stroke="'+(on?'#eef1f6':'#55617a')+'" stroke-width="'+(on?1.6:1)+'"/><text y="3.2" text-anchor="middle" font-size="8.6" font-weight="700"><tspan fill="#e8c56a">'+v[0]+'</tspan><tspan fill="#737e91">/</tspan><tspan fill="#7fb2ff">'+v[1]+'</tspan></text>'}
  // Живой гекс: все жетоны и планеты остаются теми же узлами и плавно перелетают.
  function morph(map,g,key,x,y,k,sig,html,attrs){var el=map[key],fresh=!el;
    if(fresh){el=document.createElementNS('http://www.w3.org/2000/svg','g');el.setAttribute('class','tk');Object.keys(attrs).forEach(function(a){el.setAttribute(a,attrs[a])});el.style.transform='translate('+x+'px,'+y+'px) scale(0)';g.appendChild(el);map[key]=el}
    if(el.getAttribute('data-sig')!==sig){el.innerHTML=html();el.setAttribute('data-sig',sig)}
    if(fresh)el.getBoundingClientRect();el.style.transform='translate('+x+'px,'+y+'px) scale('+k+')'}
  function sweep(map,seen){Object.keys(map).forEach(function(key){if(seen[key])return;var el=map[key];delete map[key];el.style.pointerEvents='none';el.style.transform+=' scale(0)';setTimeout(function(){el.remove()},460)})}
  function sync(box,w,np,active){if(!box._t){box.innerHTML=shell(w,'<g></g><g></g>');var gs=box.querySelector('svg').querySelectorAll(':scope>g');box._gp=gs[0];box._gt=gs[1];box._p={};box._t={}}
    var L=layout(list(),np),sp={},st={};
    L.pls.forEach(function(p,i){var key='p'+i,on=active&&np>1&&i===target;sp[key]=1;morph(box._p,box._gp,key,p.x,p.y,p.r/10,'p'+on,function(){return planetBody(i,on)},active?{'data-planet':i}:{})});
    L.items.forEach(function(t){var key=t.u.key,k=t.size/100,fresh=news[key]>0,sig=col+':'+t.u.n+':'+Math.round(t.size*2)+':'+(fresh?1:0);st[key]=1;morph(box._t,box._gt,key,t.x,t.y,k,sig,function(){return '<circle r="66" fill="transparent"/>'+(fresh?'<circle r="60" fill="none" stroke="#e8c56a" stroke-width="5"/>':'')+'<g style="pointer-events:none">'+art(t.u.kind,colorOf(t.u.owner),100)+'</g>'+count(44,40,t.u.n,Math.max(t.size/32,.5)/k)},active?{'data-key':key}:{})});
    sweep(box._p,sp);sweep(box._t,st)}
  var prevBoxes=null,mode='battle',lost={},news={},COST={"carrier":3,"cruiser":2,"destroyer":1,"dreadnought":4,"warsun":12,"flagship":8,"fighter":0.5,"infantry":0.5,"mech":2};
  // Спрайты: жетон один раз рисуется в картинку, дальше браузер двигает готовые пиксели, а не тяжёлые контуры.
  var SPR={};
  function bake(k,c){return new Promise(function(res){var key=k+c;if(SPR[key])return res();var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" width="384" height="384"><defs>'+$('i-'+k).outerHTML+'</defs>'+tok(k,0,0,100,c)+'</svg>',url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),im=new Image();
    im.onload=function(){var cv=document.createElement('canvas');cv.width=cv.height=384;cv.getContext('2d').drawImage(im,0,0);URL.revokeObjectURL(url);cv.toBlob(function(b){SPR[key]=URL.createObjectURL(b);res()})};im.onerror=res;im.src=url})}
  function bakeAll(){var t0=performance.now(),jobs=[];[COL[col],COL[(col+2)%8]].forEach(function(c){ORDER.forEach(function(k){jobs.push(bake(k,c))})});return Promise.all(jobs).then(function(){window.__bakeMs=Math.round(performance.now()-t0)})}
  function art(k,c,sz){var u=SPR[k+c];return u?'<image href="'+u+'" x="'+(-sz)+'" y="'+(-sz)+'" width="'+(2*sz)+'" height="'+(2*sz)+'"/>':tok(k,0,0,sz,c)}
  function pic(k,c,px){return '<svg viewBox="-34 -34 68 68" width="'+px+'" height="'+px+'" style="overflow:visible;pointer-events:none">'+art(k,c,34)+'</svg>'}
  function fmt(v){return v===.5?'½':String(v)}
  function cell(k,dis){var key=side+'|'+k+'|'+(SHIPS.indexOf(k)>=0?'-':target),m=news[key]||0;return '<button class="sc" data-add="'+k+'"'+(dis?' disabled':'')+'>'+(m?'<i>+'+m+'</i>':'')+pic(k,colorOf(side),50)+'<span>'+NAME[k]+'</span>'+(COST[k]!=null?'<b>'+fmt(COST[k])+'</b>':'')+'</button>'}
  function lostStrip(o){var keys=Object.keys(lost).filter(function(k){return lost[k]>0&&k[0]===o});if(!keys.length)return '<p class="empty">Потерь нет</p>';return '<div class="lostc">'+keys.map(function(k){var q=k.split('|');return '<button data-back="'+k+'" aria-label="Вернуть '+NAME[q[1]]+'">'+pic(q[1],colorOf(o),52).replace('<svg ','<svg style="margin:3px" ')+(lost[k]>1?'<i>'+lost[k]+'</i>':'')+'</button>'}).join('')+'</div>'}
  function total(){return Object.keys(news).reduce(function(t,k){return t+news[k]*(COST[k.split('|')[1]]||0)},0)}
  function render(){var c0=COL[col],c1=COL[(col+2)%8];if(target>=nP)target=0;
    sync($('big'),470,nP,true);sync($('real'),111,nP,false);
    if(!prevBoxes){$('prev').innerHTML=[0,1,2,3].map(function(n){return '<button class="pv" data-np="'+n+'"><div></div><span>'+(n===0?'Без планет':n===1?'Одна планета':n===2?'Две планеты':'Три планеты')+'</span></button>'}).join('');prevBoxes=[].slice.call($('prev').querySelectorAll('.pv'))}

    $('nphint').textContent=nP===0?'В пустой системе наземным юнитам некуда встать, они скрыты.':nP>1?'Нажмите планету на гексе: наземные юниты пойдут на неё.':'';$('nphint').style.marginTop='8px';
    var head='<div class="seg"><button class="'+(mode==='battle'?'on':'')+'" data-mode="battle">Бой</button><button class="'+(mode==='build'?'on':'')+'" data-mode="build">Строительство</button></div>';
    if(mode==='battle'){$('ctl').innerHTML=head+'<p class="lb">Потери, мои</p>'+lostStrip('m')+'<p class="lb">Потери, соперник</p>'+lostStrip('e')+'<p class="note" style="margin-top:10px">Нажмите жетон на гексе, чтобы записать потерю. Нажмите картинку здесь, чтобы вернуть юнита.</p><div class="row2"><button data-act="reset">Вернуть всех</button></div>'}
    else{var ti=total(),cnt2=Object.keys(news).reduce(function(t,k){return t+news[k]},0);$('ctl').innerHTML=head+'<div class="seg" style="margin-top:6px"><button class="'+(side==='m'?'on':'')+'" data-side="m"><span style="color:'+c0+'">●</span> Мои</button><button class="'+(side==='e'?'on':'')+'" data-side="e"><span style="color:'+c1+'">●</span> Соперник</button></div><p class="lb">Магазин</p><div class="shop">'+SHIPS.concat(['infantry','mech']).map(function(k){return cell(k,k==='infantry'||k==='mech'?nP===0:false)}).join('')+'</div><p class="lb">'+(nP>0?'Постройки на планете '+(target+1):'Постройки')+'</p><div class="shop">'+['pds','spacedock'].map(function(k){return cell(k,nP===0)}).join('')+'</div><div class="tot"><span>Купено: '+cnt2+'</span><b>'+fmt(ti)+'</b></div><div class="row2"><button data-act="reset">Отменить покупки</button></div>'}
    $('sw').innerHTML=COL.map(function(cc,i){return '<button class="sw'+(i===col?' on':'')+'" data-c="'+i+'" style="background:'+cc+'" aria-label="Цвет '+(i+1)+'"></button>'}).join('');
    try{localStorage.setItem('ti4.unitview',JSON.stringify({col:col}))}catch(e){}
  }
  function $(i){return document.getElementById(i)}
  function keyOf(k){return side+'|'+k+'|'+(SHIPS.indexOf(k)>=0?'-':target)}
  function randomize(){units={};var pick=function(a,m){return a[Math.floor(Math.random()*a.length)]};for(var i=0,n=3+Math.floor(Math.random()*7);i<n;i++){var o=Math.random()<.62?'m':'e',k=pick(SHIPS);var key=o+'|'+k+'|-';units[key]=(units[key]||0)+1+Math.floor(Math.random()*2)}for(var j=0,m=Math.floor(Math.random()*6);j<m;j++){var o2=Math.random()<.7?'m':'e',k2=pick(GROUND),key2=o2+'|'+k2+'|'+Math.floor(Math.random()*3);units[key2]=(units[key2]||0)+1}}
  document.addEventListener('click',function(e){var t=e.target;if(!t.closest)return;var b;
    if(b=t.closest('[data-mode]')){mode=b.dataset.mode;render();return}
