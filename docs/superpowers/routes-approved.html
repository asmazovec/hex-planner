    var missing=on.some(function(u){return r.units[u]>(before[S+'|me|'+u]||0)});h+=(cp.load>cp.cap?'<p class="warn">Груза больше, чем мест. Это предупреждение, не запрет.</p>':'')+(missing?'<p class="warn">Таких кораблей в системе пока нет. Это предупреждение, не запрет.</p>':'')+'<div class="row" style="margin-top:8px"><button class="btn" data-act="delroute">Убрать маршрут</button><button class="btn pri" data-act="confirm">Лететь</button></div>'}
  else{h+='<h3 style="margin-top:0">Действия раунда, по порядку</h3>'+(actions.length?'':'<p class="empty">Пока пусто. Нажмите «Новое действие».</p>');actions.forEach(function(a,i){var w=a.routes.map(function(r){return SLOTS[r.from]}).join(', ');h+='<div class="act'+(editing===a?' on':'')+(a.done?' done':'')+(playing===a?' play':'')+'"><span class="num"><svg viewBox="-13 -11.5 26 23" width="26" height="23"><polygon points="12,0 6,10.4 -6,10.4 -12,0 -6,-10.4 6,-10.4" fill="#12171f" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><b>'+(i+1)+'</b></span><span class="t" data-open="'+a.id+'">→ '+SLOTS[a.target]+'<small>'+(w?'из '+w:'нет источников')+'</small></span><button class="ic" data-up="'+a.id+'" aria-label="Выше">▲</button><button class="ic" data-dn="'+a.id+'" aria-label="Ниже">▼</button><button class="ic" data-tick="'+a.id+'" aria-label="Выполнено">'+(a.done?'✓':'○')+'</button></div>'});
    if(mode==='pickTarget'||mode==='retarget'){h+='<button class="btn" style="margin-top:6px" data-act="cancelpick">Отмена</button>'}else h+='<div class="row" style="margin-top:6px">'+(editing?'<button class="btn pri" data-act="donee">Готово</button>':'<button class="btn pri" data-act="new">Новое действие</button>')+'<button class="btn" data-act="play"'+(actions.length?'':' disabled')+'>Проиграть</button></div>';if(editing&&mode==='routes'){h+='<h3>Активная система: '+SLOTS[editing.target]+'</h3>'+(editing.routes.length?'':'<p class="note">Не та система? Нажмите на неё ещё раз.</p>')+'<h3>Источники</h3>'+(editing.routes.length?editing.routes.map(function(r){return '<div class="act" style="grid-template-columns:minmax(0,1fr) 36px"><span class="t" data-route="'+r.from+'">'+SLOTS[r.from]+(r.via.length?' через '+r.via.map(function(v){return SLOTS[v]}).join(', '):'')+'<small>'+(Object.keys(r.units).map(function(u){return RUS[u]+' '+r.units[u]}).join(', ')||'нет кораблей')+(r.pickups.length?', груз '+r.pickups.reduce(function(t,p){return t+p.n},0):'')+'</small></span><button class="ic" data-rm="'+r.from+'">✕</button></div>'}).join(''):'<p class="empty">Протяните первую стрелку.</p>')}

function render(){drawMap();drawSide()}
document.addEventListener('click',function(e){var t=e.target,b;if(!t.closest)return;
  if(b=t.closest('[data-act]')){var v=b.getAttribute('data-act');if(v==='new'){mode='pickTarget';render()}else if(v==='cancelpick'){mode=editing?'routes':'idle';render()}else if(v==='retarget'){draft=null;mode='retarget';render()}else if(v==='delaction'){actions.splice(actions.indexOf(editing),1);editing=null;draft=null;mode='idle';render()}else if(v==='donee'){if(editing&&!editing.routes.length)actions.splice(actions.indexOf(editing),1);editing=null;mode='idle';draft=null;render()}else if(v==='play')play();else if(v==='delroute'){editing.routes.splice(editing.routes.indexOf(pick),1);pick=null;mode='routes';render()}else if(v==='confirm'){var r=pick;pick=null;mode='routes';if(!Object.keys(r.units).length&&!r.pickups.length)editing.routes.splice(editing.routes.indexOf(r),1);drawSide();var a=editing;flyAction(a)}return}
  if(b=t.closest('[data-take]')){var u=b.getAttribute('data-take');pick.units[u]=(pick.units[u]||0)+1;drawSide();return}

  if(b=t.closest('[data-up]')){move(+b.getAttribute('data-up'),-1);return}if(b=t.closest('[data-dn]')){move(+b.getAttribute('data-dn'),1);return}
  if(b=t.closest('[data-tick]')){var a2=actions.find(function(x){return x.id===+b.getAttribute('data-tick')});a2.done=!a2.done;render();return}
  if(b=t.closest('[data-open]')){if(!editing){editing=actions.find(function(x){return x.id===+b.getAttribute('data-open')});mode='routes';render()}return}
  if(b=t.closest('[data-route]')){pick=editing.routes.find(function(x){return x.from===b.getAttribute('data-route')});mode='pick';render();return}
  if(b=t.closest('[data-rm]')){var r2=editing.routes.find(function(x){return x.from===b.getAttribute('data-rm')});editing.routes.splice(editing.routes.indexOf(r2),1);render();return}
  stageClick(t)});
function move(id,d){var i=actions.findIndex(function(x){return x.id===id}),j=i+d;if(j<0||j>=actions.length)return;var a=actions[i];actions[i]=actions[j];actions[j]=a;render()}
// Большой гекс: расстановка, бой, строительство. Логика утверждённого образца.
var st={slot:null,mode:'setup',side:'me',target:0,lost:{},news:{},box:null};

  if(st.mode==='battle'){var strip=function(o){var ks=Object.keys(st.lost).filter(function(x){return x.split('|')[1]===o&&st.lost[x]>0});return ks.length?'<div class="pics">'+ks.map(function(x){return bpic(x.split('|')[2],st.lost[x],col(o),'data-back="'+x+'"')}).join('')+'</div>':'<p class="empty">Потерь нет</p>'};h+='<h3>Потери, мои</h3>'+strip('me')+'<h3>Потери, соперник</h3>'+strip('enemy')+'<p class="note">Нажмите жетон, чтобы записать потерю. Нажмите картинку здесь, чтобы вернуть юнита.</p>'}
  else{var shop=SHIPS.concat(GROUND),price=st.mode==='build';h+='<div class="seg"><button class="'+(st.side==='me'?'on':'')+'" data-side="me"><span style="color:'+ME+'">●</span> Мои</button><button class="'+(st.side==='enemy'?'on':'')+'" data-side="enemy"><span style="color:'+EN+'">●</span> Соперник</button></div><h3>'+(price?'Магазин':'Поставить на гекс')+'</h3><div class="shop">'+shop.concat(BUILD).map(function(u){var isShip=SHIPS.indexOf(u)>=0,dis=!isShip&&!vals.length,full=keyFor(u),m=st.news[full]||0;return '<button class="sc" data-add="'+u+'"'+(dis?' disabled':'')+'>'+(price&&m?'<i>+'+m+'</i>':'')+'<svg viewBox="-68 -68 136 136" width="46" height="46" style="overflow:visible">'+art(u,col(st.side))+'</svg><span>'+RUS[u]+'</span>'+(price&&D.units[u]&&D.units[u].cost!=null?'<b>'+fmt(D.units[u].cost)+'</b>':'')+'</button>'}).join('')+'</div>';
    if(price){var tot=Object.keys(st.news).reduce(function(t,x){var u=x.split('|')[2];return t+st.news[x]*((D.units[u]||{}).cost||0)},0);h+='<div class="tot"><span>Куплено: '+sum(st.news)+'</span><b>'+fmt(tot)+'</b></div><p class="note">Нажмите жетон с золотым кольцом, чтобы отменить покупку.</p>'}else h+='<p class="note">Нажмите жетон на гексе, чтобы убрать одного.</p>';if(vals.length>1)h+='<p class="note">Нажмите планету: наземные юниты пойдут на неё.</p>'}$('spanel').innerHTML=h}
