# Vale fixes the vocabulary of the original game: English terms as the Rules Reference spells them,
# Russian terms as the Russian Rules Reference (Hobby World, 2021) spells them, and game names left in English.
# Run: npm run lint:terms
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = TI4

[*.{md,ts,tsx}]
BasedOnStyles = Vale, TI4, TI4Ru
Vale.Spelling = NO
Vale.Repetition = NO

# Interface strings: values only, keys are code.
[src/i18n/en.json]
View = I18n
BasedOnStyles = Vale, TI4, TI4Ru
Vale.Spelling = NO
Vale.Repetition = NO

[src/i18n/ru.json]
View = I18n
BasedOnStyles = TI4Ru

# Card texts are quotations of the publisher, written by the build as the source has them: no style is applied to them.
[src/data/texts/*.json]
BasedOnStyles =
